# Eval reproducible y sin credenciales: la factualidad se contrasta con hechos canónicos.
# Ejecutar con --no-cache para que Promptfoo mida la latencia real del proveedor.
description: Evals locales del agente Parachute
prompts:
  - '{{query}}'
providers:
  - file://evals/provider.cjs
defaultTest:
  assert:
    - type: latency
      threshold: 500
      metric: latency_ms
tests:
  - description: Agenda una cita y conserva fecha, hora y motivo
    vars:
      query: Quiero agendar una cita el 2026-10-05 a las 10:00 para asesoría.
      requiredFacts: Cita agendada correctamente | 2026-10-05 | 10:00 | asesoría
      expectedTool: calendar.createAppointment
      expectedToolArgs:
        date: '2026-10-05'
        time: '10:00'
    assert:
      - type: javascript
        value: file://evals/assertions/factuality.cjs
        metric: factuality
      - type: regex
        value: '^Cita agendada correctamente.*Confirmación: PC-\d{4}\.$'
        metric: deterministic_format
      - type: javascript
        value: file://evals/assertions/tool-execution.cjs
        metric: tool_execution

  - description: Responde el horario oficial desde la base FAQ
    vars:
      query: ¿Cuál es su horario de atención?
      requiredFacts: lunes a viernes | 08:00 a 17:00 | Guatemala
      expectedTool: knowledge.searchFAQ
      expectedToolArgs: {}
    assert:
      - type: javascript
        value: file://evals/assertions/factuality.cjs
        metric: factuality
      - type: regex
        value: '^Nuestro horario de atención es de lunes a viernes, de 08:00 a 17:00 \(hora de Guatemala\)\.$'
        metric: deterministic_format
      - type: javascript
        value: file://evals/assertions/tool-execution.cjs
        metric: tool_execution

  - description: Informa la política de cancelación sin inventar datos
    vars:
      query: ¿Con cuánto tiempo puedo cancelar o reprogramar una cita?
      requiredFacts: cancelar o reprogramar | 24 horas
      expectedTool: knowledge.searchFAQ
      expectedToolArgs: {}
    assert:
      - type: javascript
        value: file://evals/assertions/factuality.cjs
        metric: factuality
      - type: contains
        value: al menos 24 horas de anticipación
        metric: deterministic_content
      - type: javascript
        value: file://evals/assertions/tool-execution.cjs
        metric: tool_execution

